<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dBody" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="50%" stop-color="#dbe6f7"/>
      <stop offset="100%" stop-color="#8298c6"/>
    </radialGradient>
    <radialGradient id="dEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="40%" stop-color="#4fe0ff"/>
      <stop offset="100%" stop-color="#0a6ea8"/>
    </radialGradient>
    <linearGradient id="dLeg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c3d0ee"/>
      <stop offset="100%" stop-color="#5c73b3"/>
    </linearGradient>
    <linearGradient id="dPack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9fb3d6"/>
      <stop offset="100%" stop-color="#4a5c94"/>
    </linearGradient>
    <filter id="dGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="150" cy="270" rx="55" ry="10" fill="#1a2a55" opacity="0.3"/>

  <!-- back leg (mid-stride) -->
  <path d="M132 190 Q100 220 78 258" fill="none" stroke="url(#dLeg)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="78" cy="258" r="10" fill="#4a5c94"/>

  <!-- battery backpack -->
  <rect x="185" y="120" width="34" height="60" rx="10" fill="url(#dPack)" stroke="#3a4a80" stroke-width="2"/>
  <rect x="196" y="135" width="12" height="22" rx="3" fill="#38d8ff" filter="url(#dGlow)"/>

  <!-- front leg -->
  <path d="M168 190 Q190 225 205 262" fill="none" stroke="url(#dLeg)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="205" cy="262" r="10" fill="#4a5c94"/>

  <!-- body -->
  <ellipse cx="150" cy="150" rx="72" ry="66" fill="url(#dBody)" stroke="#6d86b8" stroke-width="3"/>

  <!-- cyan energy core on chest -->
  <circle cx="150" cy="170" r="16" fill="#0e1730"/>
  <circle cx="150" cy="170" r="11" fill="#38d8ff" filter="url(#dGlow)"/>

  <!-- eye housing -->
  <circle cx="150" cy="128" r="42" fill="#16213f"/>
  <circle cx="150" cy="128" r="42" fill="none" stroke="#3a4d80" stroke-width="3"/>
  <circle cx="150" cy="128" r="28" fill="url(#dEye)" filter="url(#dGlow)"/>
  <ellipse cx="138" cy="116" rx="8" ry="5" fill="#ffffff" opacity="0.9"/>

  <!-- accent lines -->
  <path d="M90 150 Q78 130 90 108" fill="none" stroke="#38d8ff" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#dGlow)"/>
  <path d="M210 150 Q222 130 210 108" fill="none" stroke="#38d8ff" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#dGlow)"/>
</svg>