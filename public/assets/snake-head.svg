<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sHead" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="50%" stop-color="#dbe6f7"/>
      <stop offset="100%" stop-color="#8298c6"/>
    </radialGradient>
    <radialGradient id="sEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="40%" stop-color="#4fe0ff"/>
      <stop offset="100%" stop-color="#0a6ea8"/>
    </radialGradient>
    <filter id="sGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="100" cy="100" rx="70" ry="58" fill="url(#sHead)" stroke="#6d86b8" stroke-width="3"/>
  <path d="M40 100 Q30 100 24 100" stroke="#3a4d80" stroke-width="10" stroke-linecap="round"/>

  <!-- energy lines -->
  <path d="M55 65 Q100 50 145 65" fill="none" stroke="#38d8ff" stroke-width="3" opacity="0.7" filter="url(#sGlow)"/>
  <path d="M55 135 Q100 150 145 135" fill="none" stroke="#38d8ff" stroke-width="3" opacity="0.7" filter="url(#sGlow)"/>

  <!-- single glowing eye -->
  <circle cx="130" cy="95" r="30" fill="#16213f"/>
  <circle cx="130" cy="95" r="30" fill="none" stroke="#3a4d80" stroke-width="2.5"/>
  <circle cx="130" cy="95" r="19" fill="url(#sEye)" filter="url(#sGlow)"/>
  <ellipse cx="122" cy="87" rx="6" ry="4" fill="#ffffff" opacity="0.9"/>
</svg>