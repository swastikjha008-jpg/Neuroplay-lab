<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080b22"/>
      <stop offset="100%" stop-color="#0f1230"/>
    </linearGradient>
    <radialGradient id="labVignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a2560" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080b22" stop-opacity="0"/>
    </radialGradient>
    <filter id="lGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#labBg)"/>
  <rect width="900" height="500" fill="url(#labVignette)"/>

  <!-- grid -->
  <g stroke="#1e3a6b" stroke-width="1" opacity="0.55">
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/><line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="450" x2="900" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/><line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/><line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/><line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="850" y1="0" x2="850" y2="500"/>
  </g>

  <!-- brighter accent grid lines -->
  <g stroke="#38d8ff" stroke-width="1.4" opacity="0.35" filter="url(#lGlow)">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- floating holographic panels -->
  <rect x="120" y="80" width="90" height="60" rx="4" fill="#38d8ff" opacity="0.08" stroke="#38d8ff" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="650" y="340" width="110" height="70" rx="4" fill="#b98bff" opacity="0.07" stroke="#b98bff" stroke-width="1" stroke-opacity="0.35"/>
  <rect x="700" y="60" width="70" height="45" rx="4" fill="#38d8ff" opacity="0.08" stroke="#38d8ff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- glowing particles -->
  <g fill="#7fe9ff">
    <circle cx="180" cy="220" r="2" opacity="0.8" filter="url(#lGlow)"/>
    <circle cx="420" cy="130" r="1.6" opacity="0.7" filter="url(#lGlow)"/>
    <circle cx="530" cy="380" r="2" opacity="0.8" filter="url(#lGlow)"/>
    <circle cx="760" cy="220" r="1.6" opacity="0.7" filter="url(#lGlow)"/>
    <circle cx="260" cy="400" r="1.8" opacity="0.75" filter="url(#lGlow)"/>
    <circle cx="850" cy="130" r="1.6" opacity="0.65" filter="url(#lGlow)"/>
  </g>
</svg>