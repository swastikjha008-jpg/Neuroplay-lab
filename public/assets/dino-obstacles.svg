<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9f4ff"/>
      <stop offset="50%" stop-color="#4fd8ff"/>
      <stop offset="100%" stop-color="#1a6fb8"/>
    </linearGradient>
    <linearGradient id="barrierMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fa3d9"/>
      <stop offset="100%" stop-color="#3d4a80"/>
    </linearGradient>
    <radialGradient id="droneBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e8edfc"/>
      <stop offset="100%" stop-color="#7e94c2"/>
    </radialGradient>
    <filter id="oGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- neon crystal spikes -->
  <g transform="translate(30,80)">
    <polygon points="30,0 45,90 15,90" fill="url(#crystal)" filter="url(#oGlow)"/>
    <polygon points="60,30 72,90 48,90" fill="url(#crystal)" opacity="0.85" filter="url(#oGlow)"/>
    <polygon points="0,40 12,90 -12,90" fill="url(#crystal)" opacity="0.75" filter="url(#oGlow)"/>
  </g>

  <!-- metallic energy barrier -->
  <g transform="translate(160,60)">
    <rect x="0" y="0" width="14" height="110" rx="4" fill="url(#barrierMetal)"/>
    <rect x="70" y="0" width="14" height="110" rx="4" fill="url(#barrierMetal)"/>
    <rect x="0" y="40" width="84" height="14" fill="#38d8ff" filter="url(#oGlow)" opacity="0.9"/>
    <rect x="0" y="70" width="84" height="8" fill="#38d8ff" filter="url(#oGlow)" opacity="0.6"/>
  </g>

  <!-- broken robotic debris -->
  <g transform="translate(300,110)">
    <rect x="0" y="10" width="30" height="20" rx="5" fill="#5c73b3" transform="rotate(-12 15 20)"/>
    <circle cx="40" cy="35" r="9" fill="#16213f" stroke="#38d8ff" stroke-width="2"/>
    <rect x="55" y="20" width="10" height="24" rx="3" fill="#8fa3d9" transform="rotate(20 60 32)"/>
  </g>

  <!-- floating laser drone -->
  <g transform="translate(430,40)">
    <ellipse cx="30" cy="70" rx="24" ry="6" fill="#1a2a55" opacity="0.3"/>
    <ellipse cx="30" cy="20" rx="38" ry="14" fill="url(#droneBody)" stroke="#5c7ab0" stroke-width="2"/>
    <circle cx="30" cy="22" r="9" fill="#38d8ff" filter="url(#oGlow)"/>
    <line x1="0" y1="24" x2="30" y2="62" stroke="#ff4fd8" stroke-width="2.5" opacity="0.85" filter="url(#oGlow)"/>
  </g>

  <!-- hovering security bot -->
  <g transform="translate(560,70)">
    <ellipse cx="30" cy="80" rx="20" ry="5" fill="#1a2a55" opacity="0.3"/>
    <circle cx="30" cy="30" r="30" fill="url(#droneBody)" stroke="#5c7ab0" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#0e1730"/>
    <circle cx="30" cy="30" r="9" fill="#ff4f6a" filter="url(#oGlow)"/>
    <rect x="12" y="58" width="8" height="14" rx="3" fill="#5c7ab0"/>
    <rect x="40" y="58" width="8" height="14" rx="3" fill="#5c7ab0"/>
  </g>
</svg>